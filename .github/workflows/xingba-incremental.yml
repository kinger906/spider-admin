name: Xingba Forum Incremental

# 日常增量：按顺序爬全部版块，每类最新 6 页，每 4 小时
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Latest pages per forum (default 6)"
        required: false
        type: string
        default: "6"

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}
  XINGBA_INCREMENTAL_PAGES: ${{ github.event.inputs.pages || '6' }}
  PYTHONUNBUFFERED: "1"

jobs:
  incremental:
    name: Xingba all forums latest pages
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Crawl all forums sequentially
        working-directory: crawlers
        run: python run_xingba_incremental.py --trigger ci
