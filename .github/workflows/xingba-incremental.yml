name: Xingba Forum Incremental

# 日常增量：按最后发表倒序抓最新 1~5 页
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}

jobs:
  incremental:
    name: Xingba latest 5 pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Crawl latest 5 pages
        working-directory: crawlers
        run: python run.py xingba-forum-798 --start-page 1 --end-page 5 --trigger ci
