name: Xingba Forum Incremental (DISABLED)

# 已停用：改由 Xingba SPA Incremental 接管。保留文件仅供必要时手动恢复。
# 日常增量已迁移到 .github/workflows/xingba-spa-incremental.yml
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE to run the legacy Discuz crawler"
        required: true
        type: string

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}
  XINGBA_INCREMENTAL_PAGES: "6"
  PYTHONUNBUFFERED: "1"

jobs:
  incremental:
    name: Xingba all forums latest pages (legacy)
    if: ${{ github.event.inputs.confirm == 'ENABLE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Crawl all forums sequentially
        working-directory: crawlers
        run: python run_xingba_incremental.py --trigger ci
