name: Xingba SPA Continuous Backfill

# range=all，从 DB 游标连续爬到末页。
# GitHub-hosted runner 单 job 最长约 6 小时，因此每 6 小时接力一轮（预算 330 分钟）。
# 约 2.9 万页需多轮；也可手动 workflow_dispatch + reset_cursor 从第 1 页重跑。
on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      reset_cursor:
        description: "Reset cursor to page 1"
        required: false
        type: boolean
        default: false
      max_page:
        description: "Stop after this page (default 30000)"
        required: false
        type: string
        default: "30000"
      chunk_pages:
        description: "Pages per inner crawl round (default 40)"
        required: false
        type: string
        default: "40"
      budget_minutes:
        description: "Time budget minutes this run (default 330)"
        required: false
        type: string
        default: "330"
      dry_run:
        description: "Print plan only"
        required: false
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}
  XINGBA_SPA_USER: ${{ secrets.XINGBA_SPA_USER }}
  XINGBA_SPA_PASS: ${{ secrets.XINGBA_SPA_PASS }}
  XINGBA_SPA_CONTINUOUS_MAX: ${{ github.event.inputs.max_page || '30000' }}
  XINGBA_SPA_CONTINUOUS_CHUNK: ${{ github.event.inputs.chunk_pages || '40' }}
  XINGBA_SPA_CONTINUOUS_BUDGET_MIN: ${{ github.event.inputs.budget_minutes || '330' }}
  PYTHONUNBUFFERED: "1"

jobs:
  continuous:
    name: Xingba SPA continuous (range=all)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Continuous crawl
        working-directory: crawlers
        run: |
          ARGS=(--trigger ci)
          if [ "${{ github.event.inputs.reset_cursor }}" = "true" ]; then
            ARGS+=(--reset-cursor)
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python run_xingba_spa_continuous.py "${ARGS[@]}"
