name: Xingba Forum Auto Backfill

# 自动回填：全部版块按 DB 游标推进，每次 6 页，每 2 小时，直到 1000 页
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per forum this run (default 6)"
        required: false
        type: string
        default: "6"
      max_page:
        description: "Stop after this page (default 1000)"
        required: false
        type: string
        default: "1000"
      dry_run:
        description: "Print plan only"
        required: false
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}
  XINGBA_AUTO_BACKFILL_PAGES: ${{ github.event.inputs.pages || '6' }}
  XINGBA_AUTO_BACKFILL_MAX: ${{ github.event.inputs.max_page || '1000' }}
  PYTHONUNBUFFERED: "1"

jobs:
  auto-backfill:
    name: Xingba auto backfill (cursor)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Run auto backfill
        working-directory: crawlers
        run: |
          ARGS=(--trigger ci)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python run_xingba_auto_backfill.py "${ARGS[@]}"
