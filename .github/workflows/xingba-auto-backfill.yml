name: Xingba Forum Auto Backfill (DISABLED)

# 已停用：改由 Xingba SPA Auto Backfill 接管。保留文件仅供必要时手动恢复。
# 自动回填已迁移到 .github/workflows/xingba-spa-auto-backfill.yml
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE to run the legacy Discuz auto backfill"
        required: true
        type: string
      pages:
        description: "Pages per forum this run (default 6)"
        required: false
        type: string
        default: "6"
      max_page:
        description: "Stop after this page (default 1000)"
        required: false
        type: string
        default: "1000"
      dry_run:
        description: "Print plan only"
        required: false
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}
  XINGBA_AUTO_BACKFILL_PAGES: ${{ github.event.inputs.pages || '6' }}
  XINGBA_AUTO_BACKFILL_MAX: ${{ github.event.inputs.max_page || '1000' }}
  PYTHONUNBUFFERED: "1"

jobs:
  auto-backfill:
    name: Xingba auto backfill (cursor, legacy)
    if: ${{ github.event.inputs.confirm == 'ENABLE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Run auto backfill
        working-directory: crawlers
        run: |
          ARGS=(--trigger ci)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python run_xingba_auto_backfill.py "${ARGS[@]}"
