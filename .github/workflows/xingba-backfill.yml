name: Xingba Forum Backfill

# 手动回填：选择版块 + 起始页 + 爬取页数（无游标、无定时）
on:
  workflow_dispatch:
    inputs:
      forum_slug:
        description: "Forum category"
        required: true
        type: choice
        options:
          - xingba-forum-798
          - xingba-forum-280
          - xingba-forum-233
          - xingba-forum-103
          - xingba-forum-723
          - xingba-forum-96
          - xingba-forum-70
          - xingba-forum-232
          - xingba-forum-135
          - xingba-forum-525
          - xingba-forum-134
          - xingba-forum-713
      start_page:
        description: "Start page (default 1)"
        required: false
        type: string
        default: "1"
      page_count:
        description: "Pages to crawl (default 100)"
        required: false
        type: string
        default: "100"
      dry_run:
        description: "Print plan only"
        required: false
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}

jobs:
  backfill:
    name: Xingba backfill ${{ github.event.inputs.forum_slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Run backfill
        working-directory: crawlers
        env:
          XINGBA_SLUG: ${{ github.event.inputs.forum_slug }}
          XINGBA_START_PAGE: ${{ github.event.inputs.start_page }}
          XINGBA_PAGE_COUNT: ${{ github.event.inputs.page_count }}
        run: |
          ARGS=(--trigger ci --slug "${{ github.event.inputs.forum_slug }}")
          ARGS+=(--start "${{ github.event.inputs.start_page || '1' }}")
          ARGS+=(--pages "${{ github.event.inputs.page_count || '100' }}")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python run_xingba_backfill.py "${ARGS[@]}"
