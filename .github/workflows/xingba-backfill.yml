name: Xingba Forum Backfill

# 手动回填：选择版块 + 起始页 + 爬取页数（无游标、无定时）
on:
  workflow_dispatch:
    inputs:
      forum_name:
        description: "版块类别"
        required: true
        type: choice
        options:
          - 杏吧华人下载区
          - 杏吧华人精品区
          - 杏吧高清新片区
          - 杏吧网盘下载区
          - 杏吧无码BT原创区
          - 杏吧亚洲无码区
          - 杏吧中文字幕区
          - 杏吧特邀新片区
          - 杏吧欧美区
          - 杏吧欧美BT区
          - 杏吧亚洲有码区
          - 杏吧有码BT原创区
      start_page:
        description: "起始页（默认 1）"
        required: false
        type: string
        default: "1"
      page_count:
        description: "爬取页数（默认 100）"
        required: false
        type: string
        default: "100"
      dry_run:
        description: "仅打印计划，不执行"
        required: false
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}
  PYTHONUNBUFFERED: "1"

jobs:
  backfill:
    name: Xingba backfill ${{ github.event.inputs.forum_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Run backfill
        working-directory: crawlers
        env:
          XINGBA_FORUM: ${{ github.event.inputs.forum_name }}
          XINGBA_START_PAGE: ${{ github.event.inputs.start_page }}
          XINGBA_PAGE_COUNT: ${{ github.event.inputs.page_count }}
        run: |
          ARGS=(--trigger ci --forum "${{ github.event.inputs.forum_name }}")
          ARGS+=(--start "${{ github.event.inputs.start_page || '1' }}")
          ARGS+=(--pages "${{ github.event.inputs.page_count || '100' }}")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python run_xingba_backfill.py "${ARGS[@]}"
