name: Xingba SPA Auto Backfill (DISABLED)

# 已由 Xingba SPA Continuous Backfill 接管（range=all、长时间接力）。
# 需要小批量手动推进时，输入 ENABLE 再跑。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE to run legacy small-batch auto backfill"
        required: true
        type: string
      pages:
        description: "Pages this run (default 6)"
        required: false
        type: string
        default: "6"
      max_page:
        description: "Stop after this page (default 30000)"
        required: false
        type: string
        default: "30000"
      dry_run:
        description: "Print plan only"
        required: false
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}
  XINGBA_SPA_USER: ${{ secrets.XINGBA_SPA_USER }}
  XINGBA_SPA_PASS: ${{ secrets.XINGBA_SPA_PASS }}
  XINGBA_SPA_AUTO_BACKFILL_PAGES: ${{ github.event.inputs.pages || '6' }}
  XINGBA_SPA_AUTO_BACKFILL_MAX: ${{ github.event.inputs.max_page || '30000' }}
  PYTHONUNBUFFERED: "1"

jobs:
  auto-backfill:
    name: Xingba SPA auto backfill (cursor)
    if: ${{ github.event.inputs.confirm == 'ENABLE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Run auto backfill
        working-directory: crawlers
        run: |
          ARGS=(--trigger ci)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python run_xingba_spa_auto_backfill.py "${ARGS[@]}"
