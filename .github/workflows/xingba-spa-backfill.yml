name: Xingba SPA Backfill

# 手动回填：起始页 + 爬取页数（无游标、无定时）
on:
  workflow_dispatch:
    inputs:
      start_page:
        description: "起始页（默认 1）"
        required: false
        type: string
        default: "1"
      page_count:
        description: "爬取页数（默认 100）"
        required: false
        type: string
        default: "100"
      dry_run:
        description: "仅打印计划，不执行"
        required: false
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  API_SECRET: ${{ secrets.API_SECRET }}
  XINGBA_SPA_USER: ${{ secrets.XINGBA_SPA_USER }}
  XINGBA_SPA_PASS: ${{ secrets.XINGBA_SPA_PASS }}
  PYTHONUNBUFFERED: "1"

jobs:
  backfill:
    name: Xingba SPA backfill
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: Install dependencies
        working-directory: crawlers
        run: pip install -r requirements.txt

      - name: Run backfill
        working-directory: crawlers
        env:
          XINGBA_SPA_START_PAGE: ${{ github.event.inputs.start_page }}
          XINGBA_SPA_PAGE_COUNT: ${{ github.event.inputs.page_count }}
        run: |
          ARGS=(--trigger ci)
          ARGS+=(--start "${{ github.event.inputs.start_page || '1' }}")
          ARGS+=(--pages "${{ github.event.inputs.page_count || '100' }}")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python run_xingba_spa_backfill.py "${ARGS[@]}"
